name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  run-pipeline:
    name: Train & Register Best Model
    runs-on: ubuntu-latest

    env:
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      # 1. Checkout Code
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: 🐍 Set Up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # 3. Install Dependencies
      - name: 📦 Install Dependencies
        run: pip install -r requirements.txt

      # 4. Configure DVC Remote credentials
      - name: 🔐 Configure DVC Remote Credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      # 5. Pull DVC data (preprocessed/cached artifacts)
      - name: 📥 Pull DVC Artifacts
        run: dvc pull --force
        continue-on-error: true

      # 6. Run full DVC pipeline
      - name: ⚙️ Reproduce DVC Pipeline
        run: dvc repro

      # 7. Push updated DVC artifacts
      - name: 📤 Push DVC Artifacts
        run: dvc push

      # 8. Commit updated dvc.lock back to repo
      - name: 💾 Commit dvc.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update dvc.lock after pipeline run [skip ci]"
          file_pattern: dvc.lock
