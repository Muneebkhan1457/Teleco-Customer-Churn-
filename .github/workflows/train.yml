name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

# ─────────────────────────────────────────────
# Required for auto commit & push
# ─────────────────────────────────────────────
permissions:
  contents: write

jobs:
  run-pipeline:
    name: Train & Register Best Model
    runs-on: ubuntu-latest

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:

      # ─────────────────────────────────────────
      # Checkout Repository
      # ─────────────────────────────────────────
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ─────────────────────────────────────────
      # Setup Python
      # ─────────────────────────────────────────
      - name: 🐍 Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ─────────────────────────────────────────
      # Install Dependencies
      # ─────────────────────────────────────────
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ─────────────────────────────────────────
      # Configure Git Identity
      # ─────────────────────────────────────────
      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # ─────────────────────────────────────────
      # Configure DVC Remote Credentials
      # ─────────────────────────────────────────
      - name: 🔐 Configure DVC Remote Credentials
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      # ─────────────────────────────────────────
      # Pull Existing DVC Artifacts
      # ─────────────────────────────────────────
      - name: 📥 Pull DVC Artifacts
        run: dvc pull --force
        continue-on-error: true

      # ─────────────────────────────────────────
      # Run Full DVC Pipeline
      # ─────────────────────────────────────────
      - name: ⚙️ Reproduce DVC Pipeline
        run: dvc repro

      # ─────────────────────────────────────────
      # Push DVC Artifacts
      # ─────────────────────────────────────────
      - name: 📤 Push DVC Artifacts
        run: dvc push

      # ─────────────────────────────────────────
      # Commit Updated dvc.lock
      # ─────────────────────────────────────────
      - name: 💾 Commit Updated dvc.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update dvc.lock after pipeline run [skip ci]"
          file_pattern: dvc.lock

      # ─────────────────────────────────────────
      # Deploy to Hugging Face Spaces
      # ─────────────────────────────────────────
      - name: 🚀 Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add hf https://iblamemoonoxx:${HF_TOKEN}@huggingface.co/spaces/iblamemoonoxx/Teleco-Communication-Churn
          git push hf main --force