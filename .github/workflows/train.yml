name: MLOps CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    name: Train & Register Best Model
    runs-on: ubuntu-latest

    env:
      DAGSHUB_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
      MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}

    steps:
      - name: ⬇️ Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          sudo apt-get install git-lfs -y
          git lfs install

      - name: 🔧 Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 🔐 Configure DVC Remote
        run: |
          dvc remote modify origin --local auth basic
          dvc remote modify origin --local user ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          dvc remote modify origin --local password ${{ secrets.MLFLOW_TRACKING_PASSWORD }}

      - name: 📥 Pull DVC Artifacts
        run: dvc pull --force
        continue-on-error: true

      - name: ⚙️ Reproduce DVC Pipeline
        run: dvc repro

      - name: 📤 Push DVC Artifacts
        run: dvc push

      - name: 💾 Commit Updated dvc.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "CI: Update dvc.lock after pipeline run [skip ci]"
          file_pattern: dvc.lock

      - name: 🚀 Deploy to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Verify model exists before pushing
          echo "Checking model files..."
          ls -R data_&_model/
          
          rm -rf .git
          git init
          git lfs install
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git remote add hf https://iblamemoonoxx:${HF_TOKEN}@huggingface.co/spaces/iblamemoonoxx/Teleco-Communication-Churn
          
          # Force LFS for binary files
          git lfs track "*.pkl"
          git lfs track "*.csv"
          git add .gitattributes
          
          git add .
          git commit -m "Deploy from CI/CD: $(date)"
          git push hf master:main --force