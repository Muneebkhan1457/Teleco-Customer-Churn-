data:
  test_size: 0.2
  random_state: 45

model:
  random_state: 45
  scale_pos_weight: 2.77   # ratio of No/Yes from training set

  # Logistic Regression
  lr_max_iter: 1000

  # Random Forest
  rf_n_estimators: 320

  # XGBoost
  xgb_n_estimators: 400
  xgb_max_depth: 5
  xgb_lr: 0.05
  xgb_subsample: 0.8
  xgb_colsample: 0.8